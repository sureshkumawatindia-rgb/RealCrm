# Render Blueprint for agreem360 (D18). Step-by-step: docs/RENDER_SETUP.md and, for staging,
# Sentry and the deploy gate, docs/FOUNDATION_SETUP_STEPS.md.
# One web service runs everything (pages, API, webhooks, live inbox, background jobs).
# A disk keeps uploaded logos, documents and WhatsApp media across deploys (a disk needs a paid
# instance and keeps the service to one instance, which this CRM needs anyway).
services:
  - type: web
    name: yellow-crm
    runtime: node
    region: singapore # closest to India
    plan: 1c-2g # 1 CPU, 2 GB; 0.5c-512mb is cheaper but tight for PDFs and the live inbox
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/v1/health
    # F1: a push to main deploys only when its GitHub checks (the tests) pass.
    autoDeployTrigger: checksPass
    disk:
      name: crm-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DOCUMENT_DIR
        value: /var/data/documents
      # New secrets are encrypted with this key (made by Render).
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Copied from your backend/.env (Render asks for them when the Blueprint is created):
      # the same database, and the same keys, so existing tokens, keys and customers'
      # quotation links keep working.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://crm.agreem360.com (docs/DOMAIN_SETUP.md), without a trailing slash; before the
      # domain is set up, the service's own https://yellow-crm.onrender.com.
      - key: PUBLIC_URL
        sync: false
      # Added later in the service's Environment tab, when they are ready (not asked here, so
      # the first deploy does not wait for them):
      # - "Connect WhatsApp" (D60, docs/WHATSAPP_SETUP.md section 7): META_APP_ID,
      #   META_APP_SECRET, META_ES_CONFIG_ID, META_WEBHOOK_VERIFY_TOKEN
      # - Who runs the CRM, on invoices and the Privacy/Terms pages: BILLING_SELLER_NAME,
      #   BILLING_SELLER_EMAIL, BILLING_SELLER_ADDRESS, BILLING_SELLER_GSTIN
      # - Error reports (F3): SENTRY_DSN (docs/FOUNDATION_SETUP_STEPS.md)
      # - Files on R2 and the weekly backup copy (F5, F4a): STORAGE_DRIVER=r2, R2_ACCOUNT_ID,
      #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_BACKUP_BUCKET (steps I–L)

  # Staging (F2): the same code from the `staging` branch, its own database with made-up data,
  # and only the test stand-ins for WhatsApp, SMS, calls, Google and Microsoft (APP_ENV=staging),
  # so nothing reaches real customers. No disk: files there are lost on each deploy until they
  # move to Cloudflare R2 (F5).
  - type: web
    name: yellow-crm-staging
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    # F6: two servers, to prove the CRM works on more than one before production does.
    numInstances: 2
    branch: staging
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DEV_TOOLS
        value: "on"
      - key: TRUST_PROXY
        value: "1"
      # Staging's own keys (never production's): sessions and secrets do not carry over.
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Set by you in the service's Environment tab: the STAGING database (never production's),
      # the same Google sign-in client id, and the staging address.
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Later (F5): STORAGE_DRIVER=r2 with its own R2_BUCKET (steps I–J), no backup bucket.

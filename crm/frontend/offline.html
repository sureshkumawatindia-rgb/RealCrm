<!doctype html>
<html lang="en" data-hi-title="ऑफ़लाइन | YELLOW CRM">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffde59" />
    <title>Offline | YELLOW CRM</title>
    <link rel="icon" type="image/png" href="./img/icons/icon-192.png" />
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --brand: #ffde59;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #a1a1a6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      p {
        color: var(--muted);
        max-width: 340px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      button,
      .actions a {
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        background: var(--brand);
        color: #1d1d1f;
        cursor: pointer;
        text-decoration: none;
      }
      .actions a {
        background: transparent;
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./img/icons/icon-192.png" alt="YELLOW CRM" />
      <h1 data-hi="आप ऑफ़लाइन हैं">You are offline</h1>
      <!-- Phase 7 (D119): pages opened before, and the Inbox, open with no network. -->
      <p data-hi="इस फ़ोन पर यह पेज पहली बार खोलने के लिए इंटरनेट चाहिए। पहले खोले गए पेज और आपका इनबॉक्स बिना इंटरनेट के भी खुलते हैं।">This page needs the internet the first time it opens on this phone. Pages you opened before, and your Inbox, open without it.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()" data-hi="फिर कोशिश करें">Try again</button>
        <a href="Inbox.html" data-hi="इनबॉक्स खोलें">Open the Inbox</a>
      </div>
    </main>
    <script>
      // No other script loads on this page (D116): its Hindi (data-hi) when the person chose
      // Hindi in the CRM — the same settings js/boot.js reads.
      try {
        const user = JSON.parse(localStorage.getItem("crm_user") || "null");
        const prefs = JSON.parse(localStorage.getItem("crm_prefs") || "null") || {};
        const language = localStorage.getItem("crm_session") ? user?.preferences?.language : prefs.language || prefs.loginLanguage;
        if (language === "hi") {
          document.documentElement.lang = "hi";
          document.title = document.documentElement.dataset.hiTitle;
          document.querySelectorAll("[data-hi]").forEach((el) => { el.textContent = el.dataset.hi; });
        }
      } catch {
        /* storage blocked: English */
      }
    </script>
  </body>
</html>

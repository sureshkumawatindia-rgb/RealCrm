<!doctype html>
<html lang="en" data-hi-title="पेज नहीं मिला | AgreemCRM">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffde59" />
    <meta name="robots" content="noindex" />
    <title>Page not found | AgreemCRM</title>
    <!-- Served for any address under /crm/frontend/ that has no page, so links are absolute. -->
    <link rel="icon" type="image/png" href="/crm/frontend/img/icons/icon-192.png" />
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --brand: #ffde59;
        --line: #e5e5ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --text: #f5f5f7;
          --muted: #a1a1a6;
          --line: #3a3a3c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      .code {
        margin: 18px 0 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      h1 {
        margin: 6px 0 10px;
        font-size: 24px;
      }
      p {
        color: var(--muted);
        max-width: 360px;
        margin: 0 auto 22px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .primary {
        background: var(--brand);
        color: #1d1d1f;
      }
      .secondary {
        border: 1px solid var(--line);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/crm/frontend/img/icons/icon-192.png" alt="AgreemCRM" />
      <div class="code">404</div>
      <h1 data-hi="यह पेज मौजूद नहीं है">This page doesn't exist</h1>
      <p data-hi="लिंक पुराना या गलत लिखा हो सकता है। आपकी चैट, लीड और ऑर्डर सुरक्षित हैं — CRM डैशबोर्ड से खोलें।">The link may be old or mistyped. Your chats, leads and orders are safe — open the CRM from the dashboard.</p>
      <div class="actions">
        <a class="primary" href="/crm/frontend/dashboard.html" data-hi="डैशबोर्ड पर जाएँ">Go to the dashboard</a>
        <a class="secondary" href="/crm/frontend/login.html" data-hi="लॉग इन करें">Log in</a>
      </div>
    </main>
    <script>
      // No other script loads on this page (D116): its Hindi (data-hi) when the person chose
      // Hindi in the CRM — the same settings js/boot.js reads.
      try {
        const user = JSON.parse(localStorage.getItem("crm_user") || "null");
        const prefs = JSON.parse(localStorage.getItem("crm_prefs") || "null") || {};
        const language = localStorage.getItem("crm_session") ? user?.preferences?.language : prefs.language || prefs.loginLanguage;
        if (language === "hi") {
          document.documentElement.lang = "hi";
          document.title = document.documentElement.dataset.hiTitle;
          document.querySelectorAll("[data-hi]").forEach((el) => { el.textContent = el.dataset.hi; });
        }
      } catch {
        /* storage blocked: English */
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme and language before the page is drawn (CP5) -->
    <script src="js/boot.js"></script>
    <title>Status | agreem360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/status.css" />
  </head>
  <body>
    <!-- Is the CRM working? (Phase 9, D151; docs/RELIABILITY.md.) Public, linked from the login page
         and the help centre: js/status.js draws it from GET /api/v1/status. -->
    <main class="status-page">
      <header class="status-top">
        <h1 class="status-brand" data-i18n="status.title">agreem360 status</h1>
        <div class="status-lang" role="group" data-i18n-aria-label="status.language" aria-label="Language">
          <button type="button" data-status-language="en" lang="en" translate="no">English</button>
          <button type="button" data-status-language="hi" lang="hi">हिंदी</button>
        </div>
      </header>

      <section class="status-hero" id="statusHero" role="status" aria-live="polite">
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        <div>
          <h2 data-i18n="status.checking">Checking…</h2>
        </div>
      </section>

      <section class="status-notices" id="statusNotices"></section>

      <section class="status-card">
        <h2 data-i18n="status.services">Services</h2>
        <ul class="status-services" id="statusServices"></ul>
      </section>

      <section class="status-card">
        <h2 data-i18n="status.recent">Recent problems</h2>
        <div id="statusIncidents"></div>
      </section>

      <footer class="status-foot">
        <a href="login.html" data-i18n="status.signIn">Sign in</a>
        <span aria-hidden="true">·</span>
        <a href="privacy.html" data-i18n="login.privacy">Privacy Policy</a>
        <span aria-hidden="true">·</span>
        <a href="terms.html" data-i18n="login.terms">Terms of Service</a>
      </footer>
    </main>
    <script src="js/app.js"></script>
    <script src="js/status.js"></script>
  </body>
</html>

  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Theme and language before the page is drawn (CP5) -->
      <script src="js/boot.js"></script>
      <title>Tasks | AgreemCRM</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      />
      <link rel="icon" type="image/png" href="./img/logo/logo.png" />
      <link rel="stylesheet" href="./css/style.css" />
      <link rel="stylesheet" href="./css/task.css" />
      <script>
        if (!localStorage.getItem("crm_session")) {
          window.location.replace("login.html");
        }
      </script>
    </head>
    <body>
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-brand">
            <span class="mark"><img src="./img/logo/logo.png" alt="logo" /></span
            ><span>AgreemCRM</span>
          </div>
          <nav class="nav-group">
            <a href="dashboard.html" class="nav-item">
              <i class="fa-solid fa-chart-pie"></i> Dashboard
            </a>

            <div class="nav-parent" data-group="sales">
              <i class="fa-solid fa-dollar-sign"></i>
              <span>Sales</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="nav-submenu" data-submenu="sales">
              <a href="customers.html" class="nav-item">
                <i class="fa-solid fa-users"></i> Customers
              </a>
              <a href="leads.html" class="nav-item">
                <i class="fa-solid fa-bullseye"></i> Leads
              </a>
              <a href="accounts.html" class="nav-item">
                <i class="fa-solid fa-building"></i> Account Champions
              </a>
              <a href="./Deals.html" class="nav-item">
                <i class="fa-solid fa-handshake"></i> Deals
              </a>
            </div>

            <div class="nav-parent" data-group="automation">
              <i class="fa-solid fa-bolt"></i>
              <span>Sales Automation</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="nav-submenu" data-submenu="automation">
              <a href="./Marketing.html" class="nav-item">
                <i class="fa-solid fa-bullhorn"></i> Marketing
              </a>
              <a href="./Sales Automation.html" class="nav-item">
                <i class="fa-solid fa-gears"></i> Sales Automation
              </a>
            </div>

            <div class="nav-parent" data-group="activities">
              <i class="fa-solid fa-calendar-days"></i>
              <span>Activities</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="nav-submenu" data-submenu="activities">
              <a href="./Tasks.html" class="nav-item active">
                <i class="fa-solid fa-list-check"></i> Tasks
              </a>
              <a href="./Calendar.html" class="nav-item">
                <i class="fa-solid fa-calendar-days"></i> Calendar
              </a>
              <a href="./Documents.html" class="nav-item">
                <i class="fa-solid fa-file-lines"></i> Documents
              </a>
            </div>

            <a href="./Support.html" class="nav-item">
              <i class="fa-solid fa-headset"></i> Support
            </a>

            <div class="nav-parent" data-group="analytics">
              <i class="fa-solid fa-chart-line"></i>
              <span>Analytics</span>
              <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="nav-submenu" data-submenu="analytics">
              <a href="./Reports & Analytics.html" class="nav-item">
                <i class="fa-solid fa-chart-line"></i> Reports & Analytics
              </a>
              <a href="./Al Insights.html" class="nav-item">
                <i class="fa-solid fa-brain"></i> AI Insights
              </a>
            </div>

            <a href="./Products.html" class="nav-item">
              <i class="fa-solid fa-box-open"></i> Products
            </a>

            <a href="./Settings.html" class="nav-item">
              <i class="fa-solid fa-gear"></i> Settings
            </a>
          </nav>
          <div class="sidebar-foot">
            <div class="sidebar-user">
              <img
                id="sidebar-user-avatar"
                src=""
                alt=""
                onerror="this.style.display = 'none'"
              />
              <div>
                <div class="sidebar-user-name" id="sidebar-user-name"></div>
                <div class="sidebar-user-email" id="sidebar-user-email"></div>
              </div>
            </div>
            <a href="#" class="logout-link" id="logout-btn"
              ><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</a
            >
          </div>
        </aside>

        <div class="main">
          <header class="topbar">
            <div style="display: flex; align-items: center; gap: 12px">
              <button
                id="menu-toggle"
                class="icon-btn"
                style="display: none; font-size: 16px"
              >
                <i class="fa-solid fa-bars"></i>
              </button>
              <h2 data-i18n="nav.tasks">Tasks</h2>
            </div>
          </header>

          <div class="page">
            <!-- KPI CARDS -->
            <div class="stat-grid" id="kpiGrid"></div>

            <!-- TOOLBAR + FILTERS -->
            <div class="toolbar">
              <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search tasks, assignees, related records..." data-i18n-placeholder="tasks.search-tasks-assignees-related-records"
                />
              </div>
              <div class="filter-bar">
                <select class="filter" id="filterStatus">
                  <option value="all" data-i18n="customers.all-status">All Status</option>
                  <option value="To Do" data-i18n="taskStatus.To Do">To Do</option>
                  <option value="In Progress" data-i18n="taskStatus.In Progress">In Progress</option>
                  <option value="Done" data-i18n="taskStatus.Done">Done</option>
                </select>
                <select class="filter" id="filterPriority">
                  <option value="all" data-i18n="tasks.all-priorities">All Priorities</option>
                  <option value="Low" data-i18n="priority.Low">Low</option>
                  <option value="Medium" data-i18n="priority.Medium">Medium</option>
                  <option value="High" data-i18n="priority.High">High</option>
                </select>
                <select class="filter" id="filterAssignee">
                  <option value="all" data-i18n="tasks.all-agents">All Agents</option>
                </select>
                <div class="filter-group">
                  <span data-i18n="tasks.due-by">Due by</span>
                  <input type="date" id="filterDueDate" aria-label="Due date" data-i18n-aria-label="inbox.details.dueDate" title="Due date" data-i18n-title="inbox.details.dueDate" />
                </div>
                <button class="link-clear" id="clearFiltersBtn" data-i18n="deals.clear-filters">Clear filters</button>
              </div>
              <div style="display: flex; gap: 10px; margin-left: auto">
                <div class="view-toggle">
                  <button id="viewKanbanBtn" class="active">
                    <i class="fa-solid fa-table-columns"></i> <span data-i18n="deals.kanban">Kanban</span></button>
                  <button id="viewTableBtn">
                    <i class="fa-solid fa-list"></i> <span data-i18n="deals.table">Table</span></button>
                </div>
                <button class="btn btn-primary" id="addBtn">
                  <i class="fa-solid fa-plus"></i> <span data-i18n="tasks.new-task">New Task</span></button>
              </div>
            </div>

            <!-- KANBAN VIEW -->
            <div id="kanbanView" class="kanban-board"></div>

            <!-- TABLE VIEW -->
            <div id="tableView" class="panel" style="display: none">
              <div id="tasksTable"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ADD / EDIT TASK MODAL -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal modal--wide">
          <div class="modal-head">
            <h3 id="modalTitle" data-i18n="tasks.new-task">New Task</h3>
            <button class="icon-btn" id="modalClose">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body">
            <form id="taskForm">
              <input type="hidden" id="editId" />
              <div class="field">
                <label data-i18n="tasks.task-title">Task Title</label>
                <input
                  type="text"
                  id="fTitle"
                  placeholder="e.g. Follow up on proposal" data-i18n-placeholder="tasks.e-g-follow-up-on-proposal"
                  required
                />
              </div>
              <div class="field">
                <label data-i18n="customers.description">Description</label>
                <textarea
                  id="fDescription"
                  rows="3"
                  placeholder="Optional details..." data-i18n-placeholder="tasks.optional-details"
                ></textarea>
              </div>
              <div class="field-row">
                <div class="field">
                  <label data-i18n="tasks.agents">Agents</label>
                  <div class="assignee-picker" id="assigneePicker">
                    <button
                      type="button"
                      class="assignee-picker__trigger"
                      id="assigneeTrigger"
                    >
                      <span
                        class="assignee-picker__avatar"
                        id="assigneeTriggerAvatar"
                        >?</span>
                      <span
                        class="assignee-picker__label is-placeholder"
                        id="assigneeTriggerLabel"
                         data-i18n="tasks.select-assignee">Select assignee</span>
                      <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="assignee-picker__menu" id="assigneeMenu"></div>
                  </div>
                  <input type="hidden" id="fAssignee" />
                </div>
                <div class="field">
                  <label data-i18n="tasks.due-date">Due Date</label>
                  <input type="date" id="fDueDate" required />
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label data-i18n="tasks.priority">Priority</label>
                  <select id="fPriority">
                    <option value="Low" data-i18n="priority.Low">Low</option>
                    <option selected value="Medium" data-i18n="priority.Medium">Medium</option>
                    <option value="High" data-i18n="priority.High">High</option>
                  </select>
                </div>
                <div class="field">
                  <label data-i18n="col.status">Status</label>
                  <select id="fStatus">
                    <option value="To Do" data-i18n="taskStatus.To Do">To Do</option>
                    <option value="In Progress" data-i18n="taskStatus.In Progress">In Progress</option>
                    <option value="Done" data-i18n="taskStatus.Done">Done</option>
                  </select>
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label data-i18n="tasks.related-to">Related To</label>
                  <select id="fRelatedType">
                    <option value="" data-i18n="tasks.none">None</option>
                    <option value="Customer" data-i18n="orders.customer">Customer</option>
                    <option value="Lead" data-i18n="dash.add.lead">Lead</option>
                    <option value="Account" data-i18n="deals.col.account">Account</option>
                    <option value="Deal" data-i18n="dash.add.deal">Deal</option>
                  </select>
                </div>
                <div class="field">
                  <label data-i18n="tasks.related-record">Related Record</label>
                  <input
                    type="text"
                    id="fRelatedName"
                    list="relatedOptions"
                    placeholder="Select a type first" data-i18n-placeholder="tasks.select-a-type-first"
                  />
                  <datalist id="relatedOptions"></datalist>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-foot">
            <button
              class="btn btn-danger-outline"
              id="deleteBtn"
              type="button"
              style="display: none; margin-right: auto"
            >
              <i class="fa-solid fa-trash"></i> <span data-i18n="tasks.delete-task">Delete Task</span></button>
            <button class="btn btn-outline" id="cancelBtn" type="button" data-i18n="common.cancel">Cancel</button>
            <button
              class="btn btn-primary"
              id="saveBtn"
              type="submit"
              form="taskForm"
             data-i18n="tasks.save-task">Save Task</button>
          </div>
        </div>
      </div>

      <div class="toast-stack" id="toast-stack"></div>

      <script src="./js/app.js"></script>
      <script src="./js/task.js"></script>
    </body>
  </html>

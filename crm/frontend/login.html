<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | YELLOW CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="login-page">
      <div class="login-card">
        <div class="login-mark">A</div>
        <h1>YELLOW CRM</h1>
        <p>Sign in with your Google account to continue</p>
        <p class="login-note" id="login-note" role="status" hidden></p>

        <div id="google-signin-slot"></div>

        <!-- Phone sign-in with a WhatsApp code (Phase 10E); shown when the CRM has it switched on. -->
        <div class="login-otp" id="loginOtp" hidden>
          <div class="login-divider"><span>or</span></div>
          <form id="otpPhoneForm" autocomplete="on">
            <input type="tel" id="otpPhone" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="Your mobile number" aria-label="Your mobile number" required />
            <button class="btn btn-outline" type="submit" id="otpSendBtn"><i class="fa-brands fa-whatsapp"></i> Get a code on WhatsApp</button>
          </form>
          <form id="otpCodeForm" autocomplete="off" hidden>
            <input type="text" id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" aria-label="6-digit code" required />
            <button class="btn btn-primary" type="submit" id="otpVerifyBtn">Sign in</button>
            <button class="login-link" type="button" id="otpBack">Use another number</button>
          </form>
          <p class="login-foot" id="otpHint">Works after you verify your number once, in Settings → Your Profile.</p>
        </div>

        <p class="login-foot">
          By continuing you agree to YELLOW CRM's usage policy.
        </p>
      </div>
    </main>

    <div class="toast-stack" id="toast-stack"></div>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>

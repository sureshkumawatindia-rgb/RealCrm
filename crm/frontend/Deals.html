<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme and language before the page is drawn (CP5) -->
    <script src="js/boot.js"></script>
    <title>Deals | YELLOW CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./img/logo/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/deals.css" />
    <script>
      if (!localStorage.getItem("crm_session")) {
        window.location.replace("login.html");
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="mark"><img src="./img/logo/logo.png" alt="logo" /></span
          ><span>YELLOW CRM</span>
        </div>
        <nav class="nav-group">
          <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
          </a>

          <div class="nav-parent" data-group="sales">
            <i class="fa-solid fa-dollar-sign"></i>
            <span>Sales</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="sales">
            <a href="customers.html" class="nav-item">
              <i class="fa-solid fa-users"></i> Customers
            </a>
            <a href="leads.html" class="nav-item">
              <i class="fa-solid fa-bullseye"></i> Leads
            </a>
            <a href="accounts.html" class="nav-item">
              <i class="fa-solid fa-building"></i> Account Champions
            </a>
            <a href="./Deals.html" class="nav-item active">
              <i class="fa-solid fa-handshake"></i> Deals
            </a>
          </div>

          <div class="nav-parent" data-group="automation">
            <i class="fa-solid fa-bolt"></i>
            <span>Sales Automation</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="automation">
            <a href="./Marketing.html" class="nav-item">
              <i class="fa-solid fa-bullhorn"></i> Marketing
            </a>
            <a href="./Sales Automation.html" class="nav-item">
              <i class="fa-solid fa-gears"></i> Sales Automation
            </a>
          </div>

          <div class="nav-parent" data-group="activities">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Activities</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="activities">
            <a href="./Tasks.html" class="nav-item">
              <i class="fa-solid fa-list-check"></i> Tasks
            </a>
            <a href="./Calendar.html" class="nav-item">
              <i class="fa-solid fa-calendar-days"></i> Calendar
            </a>
            <a href="./Documents.html" class="nav-item">
              <i class="fa-solid fa-file-lines"></i> Documents
            </a>
          </div>

          <a href="./Support.html" class="nav-item">
            <i class="fa-solid fa-headset"></i> Support
          </a>

          <div class="nav-parent" data-group="analytics">
            <i class="fa-solid fa-chart-line"></i>
            <span>Analytics</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="analytics">
            <a href="./Reports & Analytics.html" class="nav-item">
              <i class="fa-solid fa-chart-line"></i> Reports & Analytics
            </a>
            <a href="./Al Insights.html" class="nav-item">
              <i class="fa-solid fa-brain"></i> AI Insights
            </a>
          </div>

          <a href="./Products.html" class="nav-item">
            <i class="fa-solid fa-box-open"></i> Products
          </a>

          <a href="./Settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i> Settings
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-user">
            <img
              id="sidebar-user-avatar"
              src=""
              alt=""
              onerror="this.style.display = 'none'"
            />
            <div>
              <div class="sidebar-user-name" id="sidebar-user-name"></div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <a href="#" class="logout-link" id="logout-btn"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</a
          >
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 12px">
            <button
              id="menu-toggle"
              class="icon-btn"
              style="display: none; font-size: 16px"
            >
              <i class="fa-solid fa-bars"></i>
            </button>
            <h2 data-i18n="nav.deals">Deals</h2>
          </div>
        </header>

        <div class="page">
          <!-- KPI CARDS -->
          <div class="stat-grid" id="kpiGrid"></div>

          <!-- TOOLBAR + FILTERS -->
          <div class="toolbar">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="searchInput"
                placeholder="Search deals, accounts, owners..." data-i18n-placeholder="deals.search-deals-accounts-owners"
              />
            </div>
            <div class="filter-bar">
              <select class="filter" id="filterStage">
                <option value="all" data-i18n="deals.all-stages">All Stages</option>
                <option value="New" data-i18n="stage.New">New</option>
                <option value="Contacted" data-i18n="stage.Contacted">Contacted</option>
                <option value="Quote Sent" data-i18n="stage.Quote Sent">Quote Sent</option>
                <option value="Negotiation" data-i18n="stage.Negotiation">Negotiation</option>
                <option value="Won" data-i18n="stage.Won">Won</option>
                <option value="Lost" data-i18n="stage.Lost">Lost</option>
              </select>
              <select class="filter" id="filterOwner">
                <option value="all" data-i18n="deals.all-owners">All Owners</option>
              </select>
              <div class="filter-group">
                <span data-i18n="deals.min">₹ min</span>
                <input
                  type="number"
                  id="filterMinValue"
                  min="0"
                  placeholder="0"
                />
              </div>
              <div class="filter-group">
                <span data-i18n="deals.max">₹ max</span>
                <input
                  type="number"
                  id="filterMaxValue"
                  min="0"
                  placeholder="Any" data-i18n-placeholder="deals.any"
                />
              </div>
              <div class="filter-group">
                <span data-i18n="deals.closes-by">Closes by</span>
                <input type="date" id="filterCloseDate" aria-label="Close date" data-i18n-aria-label="deals.close-date" title="Close date" data-i18n-title="deals.close-date" />
              </div>
              <button class="link-clear" id="clearFiltersBtn" data-i18n="deals.clear-filters">Clear filters</button>
            </div>
            <div style="display: flex; gap: 10px; margin-left: auto">
              <div class="view-toggle">
                <button id="viewKanbanBtn" class="active">
                  <i class="fa-solid fa-table-columns"></i> <span data-i18n="deals.kanban">Kanban</span></button>
                <button id="viewTableBtn">
                  <i class="fa-solid fa-list"></i> <span data-i18n="deals.table">Table</span></button>
              </div>
              <button class="btn btn-primary" id="addBtn">
                <i class="fa-solid fa-plus"></i> <span data-i18n="dash.newDeal">New Deal</span></button>
            </div>
          </div>
          <!-- Filters on the company's own fields (D74, js/custom-fields.js): board and table -->
          <div class="cf-filter-bar" id="dealCfFilters" hidden></div>

          <div class="nav-bar-kanban-card">
            <button data-stage="New" data-i18n="deals.new">NEW</button>
            <button data-stage="Contacted" data-i18n="deals.contacted">CONTACTED</button>
            <button data-stage="Quote Sent" data-i18n="deals.quote-sent">QUOTE SENT</button>
            <button data-stage="Negotiation" data-i18n="deals.negotiation">NEGOTIATION</button>
            <button data-stage="Won" data-i18n="deals.won">WON</button>
            <button data-stage="Lost" data-i18n="deals.lost">LOST</button>
          </div>

          <!-- BOARD + SIDE PANEL -->
          <div class="deals-layout">
            <div class="deals-main">
              <div id="kanbanView" class="kanban-board"></div>
              <div id="tableView" class="panel" style="display: none">
                <div id="dealsTable"></div>
              </div>
            </div>

            <!-- RIGHT PRODUCTIVITY PANEL -->
            <aside class="side-panel">
              <div class="side-tabs">
                <button class="side-tab active" data-tab="team">
                  <i class="fa-solid fa-user-group"></i> <span data-i18n="role.Agent">Agent</span></button>
                <button class="side-tab" data-tab="tasks">
                  <i class="fa-solid fa-list-check"></i> <span data-i18n="nav.tasks">Tasks</span></button>
                <button class="side-tab" data-tab="calendar">
                  <i class="fa-solid fa-calendar-days"></i> <span data-i18n="nav.calendar">Calendar</span></button>
              </div>
              <div
                class="side-tab-content active"
                data-tab-content="team"
                id="teamTabContent"
              ></div>
              <div
                class="side-tab-content"
                data-tab-content="tasks"
                id="tasksTabContent"
              ></div>
              <div
                class="side-tab-content"
                data-tab-content="calendar"
                id="calendarTabContent"
              ></div>
            </aside>
          </div>
        </div>
      </div>
    </div>

    <!-- ADD / EDIT DEAL MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal modal--wide">
        <div class="modal-head">
          <h3 id="modalTitle" data-i18n="dash.newDeal">New Deal</h3>
          <button class="icon-btn" id="modalClose">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <form id="dealForm">
            <input type="hidden" id="editId" />
            <div class="field">
              <label data-i18n="deals.deal-name">Deal Name</label>
              <input
                type="text"
                id="fName"
                placeholder="e.g. Acme Corp — Annual Renewal" data-i18n-placeholder="deals.e-g-acme-corp-annual-renewal"
                required
              />
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="deals.account-company">Account / Company</label>
                <input
                  type="text"
                  id="fAccount"
                  list="accountOptions"
                  placeholder="Associated account" data-i18n-placeholder="deals.associated-account"
                  required
                />
                <datalist id="accountOptions"></datalist>
              </div>
              <div class="field">
                <label data-i18n="deals.contact">Contact</label>
                <input
                  type="text"
                  id="fContact"
                  list="contactOptions"
                  placeholder="Primary contact" data-i18n-placeholder="deals.primary-contact"
                />
                <datalist id="contactOptions"></datalist>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="deals.deal-value">Deal Value (₹)</label>
                <input type="number" id="fValue" min="0" required />
              </div>
              <div class="field">
                <label data-i18n="deals.expected-close-date">Expected Close Date</label>
                <input type="date" id="fCloseDate" required />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="deals.stage">Stage</label>
                <select id="fStage">
                  <option value="New" data-i18n="stage.New">New</option>
                  <option value="Contacted" data-i18n="stage.Contacted">Contacted</option>
                  <option value="Quote Sent" data-i18n="stage.Quote Sent">Quote Sent</option>
                  <option value="Negotiation" data-i18n="stage.Negotiation">Negotiation</option>
                  <option value="Won" data-i18n="stage.Won">Won</option>
                  <option value="Lost" data-i18n="stage.Lost">Lost</option>
                </select>
              </div>
              <div class="field">
                <label data-i18n="role.Owner">Owner</label>
                <select id="fOwner" required></select>
              </div>
            </div>
            <div class="field">
              <label data-i18n="deals.probability-to-close">Probability to Close</label>
              <div class="range-field">
                <input
                  type="range"
                  id="fProbability"
                  disabled
                  title="Set automatically from the stage" data-i18n-title="deals.set-automatically-from-the-stage"
                  min="0"
                  max="100"
                  step="5"
                  value="10"
                />
                <span class="range-value" id="fProbabilityValue">10%</span>
              </div>
            </div>

            <!-- The company's own fields (D73, js/custom-fields.js): leads and deals share them -->
            <div class="cf-section" id="dealCustomFields" hidden></div>

            <div id="timelineSection" style="display: none">
              <hr class="timeline-divider" />
              <label
                style="
                  display: block;
                  font-size: 12.5px;
                  font-weight: 600;
                  color: var(--text-muted);
                  margin-bottom: 10px;
                "
               data-i18n="deals.activity-notes">Activity &amp; Notes</label>
              <div class="timeline" id="timelineList"></div>
              <div class="note-input-row">
                <input
                  type="text"
                  id="noteInput"
                  placeholder="Add a note or log activity..." data-i18n-placeholder="deals.add-a-note-or-log-activity"
                />
                <button type="button" class="btn btn-outline" id="addNoteBtn">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button
            class="btn btn-danger-outline"
            id="deleteBtn"
            type="button"
            style="display: none; margin-right: auto"
          >
            <i class="fa-solid fa-trash"></i> <span data-i18n="deals.delete-deal">Delete Deal</span></button>
          <button class="btn btn-outline" id="cancelBtn" type="button" data-i18n="common.cancel">Cancel</button>
          <button
            class="btn btn-primary"
            id="saveBtn"
            type="submit"
            form="dealForm"
           data-i18n="deals.save-deal">Save Deal</button>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toast-stack"></div>

    <script src="./js/app.js"></script>
    <script src="./js/custom-fields.js"></script>
    <script src="./js/deals.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme and language before the page is drawn (CP5) -->
    <script src="js/boot.js"></script>
    <title>Calendar | AgreemCRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./img/logo/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/calendar.css" />
    <script>
      if (!localStorage.getItem("crm_session")) {
        window.location.replace("login.html");
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="mark"><img src="./img/logo/logo.png" alt="Logo" /></span
          ><span>AgreemCRM</span>
        </div>
        <nav class="nav-group">
          <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
          </a>

          <div class="nav-parent" data-group="sales">
            <i class="fa-solid fa-dollar-sign"></i>
            <span>Sales</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="sales">
            <a href="customers.html" class="nav-item">
              <i class="fa-solid fa-users"></i> Customers
            </a>
            <a href="leads.html" class="nav-item">
              <i class="fa-solid fa-bullseye"></i> Leads
            </a>
            <a href="accounts.html" class="nav-item">
              <i class="fa-solid fa-building"></i> Account Champions
            </a>
            <a href="./Deals.html" class="nav-item">
              <i class="fa-solid fa-handshake"></i> Deals
            </a>
          </div>

          <div class="nav-parent" data-group="automation">
            <i class="fa-solid fa-bolt"></i>
            <span>Sales Automation</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="automation">
            <a href="./Marketing.html" class="nav-item">
              <i class="fa-solid fa-bullhorn"></i> Marketing
            </a>
            <a href="./Sales Automation.html" class="nav-item">
              <i class="fa-solid fa-gears"></i> Sales Automation
            </a>
          </div>

          <div class="nav-parent" data-group="activities">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Activities</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="activities">
            <a href="./Tasks.html" class="nav-item">
              <i class="fa-solid fa-list-check"></i> Tasks
            </a>
            <a href="./Calendar.html" class="nav-item active">
              <i class="fa-solid fa-calendar-days"></i> Calendar
            </a>
            <a href="./Documents.html" class="nav-item">
              <i class="fa-solid fa-file-lines"></i> Documents
            </a>
          </div>

          <a href="./Support.html" class="nav-item">
            <i class="fa-solid fa-headset"></i> Support
          </a>

          <div class="nav-parent" data-group="analytics">
            <i class="fa-solid fa-chart-line"></i>
            <span>Analytics</span>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
          <div class="nav-submenu" data-submenu="analytics">
            <a href="./Reports & Analytics.html" class="nav-item">
              <i class="fa-solid fa-chart-line"></i> Reports & Analytics
            </a>
            <a href="./Al Insights.html" class="nav-item">
              <i class="fa-solid fa-brain"></i> AI Insights
            </a>
          </div>

          <a href="./Products.html" class="nav-item">
            <i class="fa-solid fa-box-open"></i> Products
          </a>

          <a href="./Settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i> Settings
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-user">
            <img
              id="sidebar-user-avatar"
              src=""
              alt=""
              onerror="this.style.display = 'none'"
            />
            <div>
              <div class="sidebar-user-name" id="sidebar-user-name"></div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <a href="#" class="logout-link" id="logout-btn"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</a
          >
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 12px">
            <button
              id="menu-toggle"
              class="icon-btn"
              style="display: none; font-size: 16px"
            >
              <i class="fa-solid fa-bars"></i>
            </button>
            <h2 data-i18n="nav.calendar">Calendar</h2>
          </div>
        </header>

        <div class="page">
          <!-- KPI CARDS -->
          <div class="stat-grid" id="kpiGrid"></div>

          <!-- TOOLBAR -->
          <div class="toolbar">
            <div class="cal-nav">
              <button class="icon-btn" id="prevMonthBtn">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <h3 id="monthLabel" data-i18n="cal.month-year">Month Year</h3>
              <button class="icon-btn" id="nextMonthBtn">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
              <button class="btn btn-outline" id="todayBtn" data-i18n="dash.today">Today</button>
            </div>
            <div style="display: flex; gap: 10px; margin-left: auto">
              <select class="filter" id="filterType">
                <option value="all" data-i18n="cal.all-types">All Types</option>
                <option value="Meeting" data-i18n="event.Meeting">Meeting</option>
                <option value="Call" data-i18n="event.Call">Call</option>
                <option value="Follow-up" data-i18n="event.Follow-up">Follow-up</option>
                <option value="Demo" data-i18n="event.Demo">Demo</option>
                <option value="Deadline" data-i18n="event.Deadline">Deadline</option>
                <option value="Reminder" data-i18n="event.Reminder">Reminder</option>
              </select>
              <select class="filter" id="filterAssignee">
                <option value="all" data-i18n="tasks.all-agents">All Agents</option>
              </select>
              <button class="btn btn-primary" id="addBtn">
                <i class="fa-solid fa-plus"></i> <span data-i18n="cal.new-event">New Event</span></button>
            </div>
          </div>

          <!-- CALENDAR + SIDE PANEL -->
          <div class="calendar-layout">
            <div class="calendar-main">
              <div class="calendar-weekdays">
                <span data-i18n="cal.sun">Sun</span><span data-i18n="cal.mon">Mon</span><span data-i18n="cal.tue">Tue</span><span data-i18n="cal.wed">Wed</span><span data-i18n="cal.thu">Thu</span><span data-i18n="cal.fri">Fri</span><span data-i18n="cal.sat">Sat</span>
              </div>
              <div class="calendar-grid" id="calendarGrid"></div>
              <!-- Phones: the chosen day's events under the month (calendar.js renderInlineAgenda) -->
              <div class="day-agenda-inline" id="dayAgendaInline" hidden></div>
            </div>

            <aside class="side-panel">
              <div class="side-tabs">
                <button class="side-tab active" data-tab="upcoming">
                  <i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="cal.upcoming">Upcoming</span></button>
                <button class="side-tab" data-tab="team">
                  <i class="fa-solid fa-user-group"></i> <span data-i18n="c360.team">Team</span></button>
              </div>
              <div
                class="side-tab-content active"
                data-tab-content="upcoming"
                id="upcomingTabContent"
              ></div>
              <div
                class="side-tab-content"
                data-tab-content="team"
                id="teamTabContent"
              ></div>
            </aside>
          </div>
        </div>
      </div>
    </div>

    <!-- ADD / EDIT EVENT MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal modal--wide">
        <div class="modal-head">
          <h3 id="modalTitle" data-i18n="cal.new-event">New Event</h3>
          <button class="icon-btn" id="modalClose">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <form id="eventForm">
            <input type="hidden" id="editId" />
            <div class="field">
              <label data-i18n="cal.event-title">Event Title</label>
              <input
                type="text"
                id="fTitle"
                placeholder="e.g. Demo call with Acme Corp" data-i18n-placeholder="cal.e-g-demo-call-with-acme"
                required
              />
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="quotes.type">Type</label>
                <select id="fType">
                  <option value="Meeting" data-i18n="event.Meeting">Meeting</option>
                  <option value="Call" data-i18n="event.Call">Call</option>
                  <option value="Follow-up" data-i18n="event.Follow-up">Follow-up</option>
                  <option value="Demo" data-i18n="event.Demo">Demo</option>
                  <option value="Deadline" data-i18n="event.Deadline">Deadline</option>
                  <option value="Reminder" data-i18n="event.Reminder">Reminder</option>
                </select>
              </div>
              <div class="field">
                <label data-i18n="quotes.col.date">Date</label>
                <input type="date" id="fDate" required />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="cal.start-time">Start Time</label>
                <input type="time" id="fStartTime" />
              </div>
              <div class="field">
                <label data-i18n="cal.end-time">End Time</label>
                <input type="time" id="fEndTime" />
              </div>
            </div>
            <div class="field">
              <label data-i18n="cal.assign-to-agent">Assign to Agent</label>
              <div class="assignee-picker" id="assigneePicker">
                <button
                  type="button"
                  class="assignee-picker__trigger"
                  id="assigneeTrigger"
                >
                  <span
                    class="assignee-picker__avatar"
                    id="assigneeTriggerAvatar"
                    >?</span>
                  <span
                    class="assignee-picker__label is-placeholder"
                    id="assigneeTriggerLabel"
                     data-i18n="cal.select-agent">Select agent</span>
                  <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="assignee-picker__menu" id="assigneeMenu"></div>
              </div>
              <input type="hidden" id="fAssignee" />
            </div>
            <div class="field-row">
              <div class="field">
                <label data-i18n="tasks.related-to">Related To</label>
                <select id="fRelatedType">
                  <option value="" data-i18n="tasks.none">None</option>
                  <option value="Customer" data-i18n="orders.customer">Customer</option>
                  <option value="Lead" data-i18n="dash.add.lead">Lead</option>
                  <option value="Account" data-i18n="deals.col.account">Account</option>
                  <option value="Deal" data-i18n="dash.add.deal">Deal</option>
                </select>
              </div>
              <div class="field">
                <label data-i18n="tasks.related-record">Related Record</label>
                <input
                  type="text"
                  id="fRelatedName"
                  list="relatedOptions"
                  placeholder="Select a type first" data-i18n-placeholder="tasks.select-a-type-first"
                />
                <datalist id="relatedOptions"></datalist>
              </div>
            </div>
            <div class="field">
              <label data-i18n="customers.description">Description</label>
              <textarea
                id="fDescription"
                rows="3"
                placeholder="Optional notes..." data-i18n-placeholder="cal.optional-notes"
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button
            class="btn btn-danger-outline"
            id="deleteBtn"
            type="button"
            style="display: none; margin-right: auto"
          >
            <i class="fa-solid fa-trash"></i> <span data-i18n="cal.delete-event">Delete Event</span></button>
          <button class="btn btn-outline" id="cancelBtn" type="button" data-i18n="common.cancel">Cancel</button>
          <button
            class="btn btn-primary"
            id="saveBtn"
            type="submit"
            form="eventForm"
           data-i18n="cal.save-event">Save Event</button>
        </div>
      </div>
    </div>

    <!-- DAY AGENDA MODAL (shown when a day has multiple items) -->
    <div class="modal-overlay" id="dayModalOverlay">
      <div class="modal">
        <div class="modal-head">
          <h3 id="dayModalTitle" data-i18n="cal.agenda">Agenda</h3>
          <button class="icon-btn" id="dayModalClose">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div id="dayAgendaList"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" id="dayModalCloseBtn" type="button" data-i18n="common.close">Close</button>
          <button class="btn btn-primary" id="dayModalAddBtn" type="button">
            <i class="fa-solid fa-plus"></i> <span data-i18n="cal.add-event">Add Event</span></button>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toast-stack"></div>

    <script src="./js/app.js"></script>
    <script src="../frontend/js/calendar.js"></script>
  </body>
</html>
